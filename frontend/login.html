<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, sans-serif;

      display:flex;
      justify-content:center;
      align-items:center;

      min-height:100vh;

      background: linear-gradient(
        90deg,
        #ff00ff,
        #00a2ff, 
        #ff00ff  
      );

      background-size: 800% 800%;

      animation: flowColors 6s ease-in-out infinite;
    }

    @keyframes flowColors{

      0%{
        background-position: 0% 100%;
      }

      50%{
        background-position: 100% 50%;
      }

      100%{
        background-position: 50% 100%;
      }
    }

    .container{

      width:100%;
      max-width:400px;

      background: rgba(255, 255, 255, 0.509);

      background: linear-gradient(180deg, #ff00ff, #00a2ff);

      padding:35px;

      border-radius:40px;

      box-shadow: 0 10px 99px rgb(0, 8, 255);
      cursor: pointer;

      transition:2s ease;
    }

    .container:hover{
      transform: translateZ(-90px) scale(1.6); 
      background: linear-gradient(360deg, #ff00ff, #00a2ff);
            box-shadow: 0 1px 20px rgb(255, 255, 255);

    }

    h2{
      text-align:center;
      margin-bottom:25px;
      color:#ffffff;
      font-size:42px;
    }

    input{

      width:100%;

      padding:14px;

      margin-bottom:18px;

      border:none;

      outline:none;

      border-radius:30px;

      font-size:16px;

      background: rgb(255, 255, 255);

      transition:0.2s;
    }

    input:focus{

      background:white;

      transform:scale(1.08);

      box-shadow: 0 1px 20px rgb(255, 255, 255);
    }

    button{

      width:100%;

      padding:14px;

      border:none;

      border-radius:50px;

      font-size:18px;

      font-weight:bold;

      cursor:pointer;

      color:white;

            box-shadow: 0 10px 99px rgb(0, 8, 255);


      background: linear-gradient(180deg,  #ff00ff, #00a2ff);

      transition:0.1s ease;

     
    }

    button:hover{

      transform:translatez(-20px) scale(1.2);

      background: linear-gradient(360deg, #ff00ff, #00a2ff);

      box-shadow: 0 1px 20px rgb(255, 255, 255);
    }

     button:active{

      transform:scale(1.15);

       color:rgb(30, 255, 0);

      box-shadow:
  0 0 10px rgb(60, 255, 0),
  0 0 10px rgba(60, 255, 0),
  0 0 10px rgba(60, 255, 0);

    }

    .signup-text{
      text-align:center;
      margin-top:18px;
      margin-bottom:10px;
      color:#000000;
      font-weight:bold;
    }

    .forgot-text{

      text-align:center;

      margin-top:8px;

      margin-bottom:0px;
     
      width:50%;

      padding:6px;

      border:10;

      border-radius:20px;

      font-size:16px;
      
      cursor:pointer;

      color:white;

            box-shadow: 0 10px 99px rgb(0, 8, 255);


      background: linear-gradient(180deg, #ff00ff, #00a2ff);

      font-weight:bold;

      transition:0.1s ease;

       margin-left:47%; 

}

.forgot-text:hover{

        transform:translatez(-40px) scale(1.1);

        color:#ff0000;

        background: linear-gradient(360deg, #ff00ff, #00a2ff);

box-shadow:
  0 0 10px rgba(255,0,0,0.8),
  0 0 10px rgba(255,0,0,0.9),
  0 0 10px rgba(255,0,0,1);

}

    @media(max-width:500px){

      .container{
        padding:25px;
      }

      h2{
        font-size:28px;
      }

      input,
      button{
        font-size:15px;
      }
    }

  </style>
</head>

<body>

<div class="container">

  <h2>Login</h2>

  <input type="email" id="email" placeholder="Enter Email">

  <input type="password" id="password" placeholder="Enter Password">

  <button onclick="login()">Login</button>


  <p class="forgot-text" onclick="window.location.href='forgot.html'">
  Forgot Password?
</p>


  <p class="signup-text">
    Don't have an account?
  </p>

  <button onclick="window.location.href='signup.html'">
    Signup
  </button>

</div>


<script src="auth.js"></script>
</body>
</html>
