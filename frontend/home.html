<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriCompare</title>
  <link rel="icon" href="fav1.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }
    body{
    font-family: 'Inter', sans-serif;
    flex-direction:column;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow-x:hidden;
    overflow-y:auto;
    background:#000000;
    position:relative;
     user-select:none;
}
::-webkit-scrollbar{ width:8px; } 
::-webkit-scrollbar-track{ background:#000000; } 
::-webkit-scrollbar-thumb{ background:linear-gradient(180deg,#ff00c8,#00a2ff); border-radius:10px; } 
::-webkit-scrollbar-thumb:hover{ background:linear-gradient(180deg,#00a2ff,#ff00c8); box-shadow: 0 1px 55px rgb(255, 255, 255); transform: scale(1.05); }



nav{
    background:linear-gradient(180deg,#ff00c8,#00a2ff);
    color:white;
    scale: 1;
    width:100%;
    max-width:1000px;

    margin:20px auto 0;

    padding:5px;

    text-align:center;

    border-radius:20px 20px 0px 0px;

    font-size:30px;
    font-weight:bold;

    cursor:pointer;

    position:relative;
    z-index:100;

    transition:.3s;
}
     nav:hover {
       background: linear-gradient(360deg, #ff00c8, #00a2ff);
       border-radius:60px;
     box-shadow:
    0 0 22px rgb(255, 255, 255),
    0 0 22px rgb(255, 255, 255),
    0 0 22px rgb(255, 255, 255);
     
    transition: .4s;
}

.container{
    scale: 0.8;
    z-index: 1;
    max-width:800px;
    margin-top:0;
    width:100%;
    margin:0px auto 0;
    padding:50px 30px;
    background:linear-gradient(180deg,#ff00c8,#00a2ff);
    border-radius:90px;
    cursor:pointer;
 transition:
        transform .4s;
            position: relative;
    
}

.container:hover{
    border-radius:0px 0px 20px 20px;
      transform:scale(1.25);  
    background:linear-gradient(360deg,#ff00c8,#00a2ff);
        animation:.4s;
}


.loading-text {
  margin: 0;
font-family: 'Times New Roman', serif;
  letter-spacing: -2.5px;
  font-size: 60px;
  font-weight: bold;
  text-align: center;
}
    .foods {
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-wrap: wrap;
      gap: 100px;
      margin-bottom: 35px;
}
    .food-box1 {
      margin-bottom: 50px;
      text-align: center;
}
    .food-box img {
      margin-bottom: 15px;
      margin-top: 4px;
      max-width: 160px;
      height: 160px;
      margin-left: 10px ;
      margin-right: 10px;
      object-fit: cover;
      border-radius:20px;
      cursor: pointer;
      transition: transform 0.1s ;

}
    .food-box img:hover {
            border-radius: 0px;
          outline-offset: 1.8px;
    outline: 1.4px solid #ffffff;
      transform: scale(1.05);
      background: linear-gradient(360deg, #ff00c8, #00a2ff);
           box-shadow: 0 1px 35px rgb(255, 255, 255); 
}
     select{
      margin-top: 0px;
      width:100%;
      padding:10px;
      border:none;
      border-radius:10px;
      font-size:20px;
      cursor:pointer;
      color:white;
      background: linear-gradient(180deg, #ff00c8,#00a2ff);
      outline: 1.1px solid rgb(255, 255, 255);
      outline-offset: 1.5px;
      transition:0.2s ease; 
}
    select:hover{
    border-radius:40px;
    outline: 1.1px solid #ffffff;
    outline-offset: 1.5px;
    background: linear-gradient(0deg, #ff00c8,#00a2ff);
    box-shadow: 0 25px 25px rgb(0, 0, 0);
    color: #000000;
    transition:0.2s ease; 
}
    select:active{

      outline: 4px solid #00ff11;
      outline-offset: 1.8px;
      color:rgb(60, 255, 1);
      transition:0.01s ease; 
}

select option{
   position:absolute;
  top:100%;
  left:0;
  background:#000000;
  color:#ffffff;
  font-size:20px;
  text-align:center;
  padding:8px;
  
}
    button{
      margin-top: 0px;
      width:40%;
      padding:10px;
      border:none;
      border-radius:10px;
      font-size:24px;
      cursor:pointer;
      color:white;
      background: linear-gradient(180deg, #ff00c8,#00a2ff);
      outline: 1.1px solid #ffffff;
      outline-offset: 1.5px;
      transition:0.2s ease; 
}
    button:hover{
      scale: 1.1;
    border-radius:30px;
    outline: 1.1px solid #00ff11;
    outline-offset: 1.5px;
    background: linear-gradient(0deg, #ff00c8,#00a2ff);
    box-shadow: 0 30px 30px rgb(0, 0, 0);
    color: #00ff00;
    transition:0.2s ease; 
}
    button:active{
      outline: 4px solid #00ff11;
      outline-offset: 1.2px;
      transform:scale(1.2);
      color:rgb(60, 255, 1);

}
    .result {
      text-align: center;
       padding-bottom:0;
       margin-bottom:0;
      font-size: 40px;
      margin-top: 35px;
      font-weight: bold;
      color: #ffffff;
      display:none;
} 
#chart{
        margin-top: 25px;
   display:none;
    max-height:350px;
    border:0.5px solid rgba(0, 0, 0, 0);
}

#bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
    pointer-events:none;
}
.profile-btn{
    position:fixed;
    top:22px;
    right:22px;
    z-index:9999;
    cursor:pointer;
}


.top-avatar{
    width:65px;
    height:65px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    font-weight:bold;
    color:#ffffff;
    background:linear-gradient(
        135deg,
        #ff00c8,
        #00a2ff
    );
    transition:0.4s ease; 
}

.top-avatar:hover{
   display:flex;
    align-items:center;
    justify-content:center;
      border-radius:60px;
   transform: scale(1.15);
    transition:0.3s ease; 
        background:linear-gradient(315deg,#ff00c8,#00a2ff);
      box-shadow:
    0 0 20px rgb(255, 255, 255),
    0 0 20px rgb(255, 255, 255),
    0 0 20px rgb(255, 255, 255);
}


.profile-panel{
    position:fixed;
    top:0;
    right:-300px;
    width:300px;
    height:100vh;

    background:rgba(255, 255, 255, 0);
    backdrop-filter:blur(10px);

    border-left:1.5px solid rgba(80, 80, 80, 0.4);

    transition:2.8s ease;
    z-index:9998;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:100px;
}

.profile-panel.active{
    right:0;
    box-shadow:
    0 0 25px rgba(0, 229, 255, 0),
    0 0 25px rgba(0, 81, 255, 0);
}

.profile-avatar{
    width:155px;
    height:155px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    font-size:52px;
    font-weight:bold;
    color:white;

    background:linear-gradient(
        135deg,
        #ff00c8,
        #00a2ff
    );

    transition:0.3s ease; 

}
.profile-avatar:hover{
background:linear-gradient(315deg,#ff00c8,#00a2ff);
transform: scale(1.16);
    transition:0.3s ease; 
      box-shadow:
    0 0 20px rgb(255, 255, 255),
    0 0 20px rgb(255, 255, 255),
    0 0 20px rgb(255, 255, 255);
}

.profile-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.change-photo{
    margin-top:25px !important;
    margin-bottom:2px !important;
}

.change{
    margin-top:20px !important;
}

.change-photo,.change{

    justify-content:center;
    margin-top:25px;
    color:rgba(255, 255, 255,.9);
    cursor:pointer;
    font-size:18px;
    width:45%;
    padding:5px;
    outline: 2px solid rgba(255, 255, 255, 0.3);
    outline-offset: 1px;
    background: transparent;
    border-radius:5px;
    cursor:pointer;
        transition:0.2s ease; 

}

.change-photo:hover{
      justify-content:center;
    transform: scale(1.25);
    border-radius:30px;
    outline: 2px solid #00ff11;
    outline-offset: 1px;
    background: transparent;
    color: #00ff00;
    transition:0.2s ease; 
}
.change:hover{
      justify-content:center;
      transform: scale(1.25);
    border-radius:30px;
    outline: 2px solid #ff0000;
    outline-offset: 1px;
    background: transparent;
    color: #ff0000;
    transition:0.2s ease; 
    

}


.change-photo:active{
            box-shadow:
      0 0 15px rgb(60, 255, 1),
      0 0 15px rgba(60, 255, 1),
      0 0 15px rgba(60, 255, 1);
      transform:scale(1.35);
}

.change:active{
            box-shadow:
      0 0 15px rgb(255, 1, 1),
      0 0 15px rgba(255, 1, 1),
      0 0 15px rgba(255, 1, 1);
      transform:scale(1.35);
}



#userName{
    margin-top:20px;
    color:white;
    font-size:28px;
    text-align:center;
}

#userEmail{
    color:#ccc;
    margin-top:8px;
    text-align:center;
    word-break:break-word;
}




#logoutText{

    position:absolute;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;

    letter-spacing:1.5px;

      color:#ffffff;

    opacity:1;
}

.logout-track{
    position:relative;
    width:265px;
    height:64px;
    margin-top:50px;
    border-radius:50px;
    outline:1.5px solid rgba(255, 255, 255, 0.2);
    overflow:hidden;
}
.logout-slider{

    touch-action:none;

    user-select:none;

    -webkit-user-select:none;

    cursor:grab;

    transform:translateX(0);
    transition:box-shadow .15s ease;
    will-change:transform;
}

.logout-slider{
    position:absolute;
    top: 0;
    left:0;
    width:65px;
    height:65px;
    border-radius:50px;
    align-items: center;
    cursor:grab;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;

}

.logout-slider:hover{
    background:transparent;

}

.logout-slider img{

    width:48px;
    height:48px;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
}

.logout-modal{

    position:fixed;
    inset:0;

    display:none;

    justify-content:center;

    align-items:center;

    background:rgba(255, 255, 255, 0);

    z-index:20000;
}

.logout-box{
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    top: 0;
    width:430px;
    font-weight: lighter;

    font-family: 'Inter', sans-serif;

    padding:40px 10px;

    border-radius:20px;

  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);

    border:1.5px solid rgba(255, 255, 255, 0.18);

    text-align:center;
    
    padding-top: 26px;

    z-index:2;

    opacity:0;

animation: dropCenter 4.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        transition:1s ease; 
}

.logout-box:hover{
 box-shadow:
    0 0 15px rgb(255, 0, 0),
    0 0 20px rgb(255, 0, 0),
    0 0 25px rgb(255, 0, 0);
        transition:.4s ease; 
}

@keyframes dropCenter{

    0%{

        opacity:0;

        transform:
        translateY(-800px)
        scale(1);
    }

    100%{

        opacity:1;

        transform:
        translateY(0)
        scale(1);
    }
}



.logout-actions{

    display:flex;

    justify-content:center;

    gap:48px;

    margin-top:15px;
}



.change-photo1{
    margin-top:20px !important;
    
}
.change1{
    margin-top:20px !important;
}

.change-photo1,.change1{
  font-family: 'Inter', sans-serif;
    margin-top:25px;
    color:#fff;
    cursor:pointer;
    font-size:26px;
    height: 42px;
    width:125px;
    padding:3px;
    outline: 2px solid rgba(255, 255, 255, 0.2);
    outline-offset: 1px;
    background: transparent;
    border-radius:8px;
    cursor:pointer;
        transition:0.2s ease; 

}

.change-photo1:hover{
    transform: scale(1.15);
    border-radius:30px;
    outline: 2px solid #00ff11;
    outline-offset: 1px;
    background: transparent;
    color: #00ff00;
    transition:0.2s ease; 
}
.change1:hover{
      transform: scale(1.15);
    border-radius:30px;
    outline: 2px solid #ff0000;
    outline-offset: 1px;
    background: transparent;
    color: #ff0000;
    transition:0.2s ease; 

}

.change-photo1:active{
            box-shadow:
      0 0 15px rgb(60, 255, 1),
      0 0 15px rgba(60, 255, 1),
      0 0 15px rgba(60, 255, 1);
      transform:scale(1.3);
}

.change1:active{
            box-shadow:
      0 0 15px rgb(255, 1, 1),
      0 0 15px rgba(255, 1, 1),
      0 0 15px rgba(255, 1, 1);
      transform:scale(1.3);
}

.logout-cable:hover,.logout-cable1:hover{
 box-shadow:
    0 0 15px rgb(0, 255, 255),
    0 0 20px rgb(0, 255, 255),
    0 0 25px rgb(0, 255, 255);
        transition:.6s ease; 
        border-radius: 10px;
}

.logout-cable{
          transition:1.2s ease; 

    position:absolute;

    bottom:0;
    left:38.5%;

    width:20px;
    height:263.5px;
     border-radius: 0px;
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);

    border:1.5px solid rgba(255, 255, 255, 0.18);

animation: cableDrop 3.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes cableDrop{

   0%{

        opacity:0;

        transform:
        translateY(400px)
        scale(1);
    }

    100%{

        opacity:1;

        transform:
        translateY(0)
        scale(1);
    }
}


.logout-cable1{
        transition:1.2s ease; 
    position:absolute;

    bottom: 0;
    right:38.5%;

     width:20px;
    height:263.5px;
 backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);

    border:1.5px solid rgba(255, 255, 255, 0.18);
    border-radius: 0px;
animation: cableDrop1 3.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes cableDrop1{

   0%{

        opacity:0;

        transform:
        translateY(400px)
        scale(1);
    }

    100%{

        opacity:1;

        transform:
        translateY(0)
        scale(1);
    }
}

.hide-page{

    opacity:0;

    transform:translatey(600px) scale(20);

    pointer-events:none;

    transition:cubic-bezier(0.45, 0.05, 0.95, 0.95) ease;
}

.logout-track,
.logout-slider,
#logoutText{
    user-select:none;
    -webkit-user-select:none;
}

#logoutText{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
}

#logoutText span{
    color:rgba(255, 255, 255, 0.7);
    font-weight:900;
    transition:.2s;
}


</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div id="pageContent">

<div class="profile-btn" onclick="toggleProfile()">
    <div id="topAvatar" class="top-avatar"></div>
</div>

<div id="profilePanel" class="profile-panel">

    <div id="profileAvatar" class="profile-avatar"></div>

    <h3 id="userName"></h3>

    <p id="userEmail"></p>

    <input
        type="file"
        id="profileInput"
        accept="image/*"
        hidden>

    <label for="profileInput" class="change-photo">
        Change Photo
    </label>

    <div class="change" onclick="removePhoto()">
        Remove Photo
    </div>

    <div class="logout-track">

<div id="logoutText">
    <span>SIGN</span>
    <span>OUT</span>
</div>

        <div id="logoutSlider" class="logout-slider">

            <img
            src="logout.png"
            draggable="false">

        </div>

    </div>

</div> <!-- profilePanel close -->

<nav class="logo">
   <p class="loading-text"> NutriCompare </p>
  </nav>
  <div class="container">
    <div class="foods">
      <div class="food-box">
        <img id="img1" src="https://static.vecteezy.com/system/resources/previews/035/833/474/non_2x/portrait-of-asian-girl-thinking-what-to-eat-choosing-between-cupcake-and-broccoli-vegetables-white-background-photo.jpg" alt="Food 1"/>
        <br>
        <select id="food1">
          <option value="">  Select Food 1  </option>
        </select>
      </div>
      <div class="food-box1">
       <span style="font-size:40px; color:white; font-weight:bold; font-family:'Times New Roman', serif;">
            VS
      </span>     
     </div>
      <div class="food-box">
        <img id="img2" src="https://static.vecteezy.com/system/resources/previews/035/828/904/non_2x/portrait-of-asian-girl-thinking-what-to-eat-choosing-between-cupcake-and-broccoli-vegetables-white-background-photo.jpg" alt="Food 2"/>
        <br>
        <select id="food2">
          <option value=""> Select Food 2 </option>
        </select>
      </div>
    </div>
    <div style="text-align:center">
      <button onclick="updateChart()">Compare food items</button>
    </div>
      <canvas id="chart"></canvas>
      <div class="result" id="resultText" > </div>
      </div>
</div>

<div id="logoutModal" class="logout-modal">
<div class="logout-cable"></div>
<div class="logout-cable1"></div>

    <div class="logout-box">

        <h2>Are you sure you want to sign out?</h2>

        <div class="logout-actions">

            <button class="change-photo1" onclick="closeLogoutModal()">
                Cancel
            </button>

            <button class="change1" onclick="confirmLogout()">
                Sign Out
            </button>

        </div>

    </div>

</div>
<script src="auth.js"></script>
</body>
</html>
